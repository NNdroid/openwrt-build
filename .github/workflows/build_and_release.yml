name: Build and Release OpenWrt

on:
  push:
    branches:
      - main
    paths:
      - "build.sh"
      - "VERSION"
      - "config/**"
      - "userpatches/**"
      - "third_party/**"
      - ".github/workflows/build_and_release.yml"
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: "Stable OpenWrt tag; leave blank for latest stable"
        required: false
        type: string
        default: ""
      targets:
        description: "Firmware target"
        required: true
        type: choice
        default: all
        options:
          - all
          - x86_64
          - caimore_cm520
  schedule:
    - cron: "10 13 * * *"

permissions:
  contents: write

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve stable OpenWrt version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      current: ${{ steps.resolve.outputs.current }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and targets
        id: resolve
        env:
          REQUESTED_TAG: ${{ github.event.inputs.openwrt_tag || '' }}
          REQUESTED_TARGETS: ${{ github.event.inputs.targets || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          CURRENT="$(tr -d '[:space:]' < VERSION)"

          if [[ -n "${REQUESTED_TAG}" ]]; then
            TAG="${REQUESTED_TAG}"
          else
            TAG="$(
              git ls-remote --tags --refs https://github.com/openwrt/openwrt.git 'v[0-9]*' |
                awk '{ sub("refs/tags/", "", $2); print $2 }' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n1
            )"
          fi

          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Could not resolve a stable OpenWrt tag"
            exit 1
          }

          case "${REQUESTED_TARGETS}" in
            all)
              MATRIX='{"target":["x86_64","caimore_cm520"]}'
              ;;
            x86_64|caimore_cm520)
              MATRIX="{\"target\":[\"${REQUESTED_TARGETS}\"]}"
              ;;
            *)
              echo "::error::Unsupported target: ${REQUESTED_TARGETS}"
              exit 1
              ;;
          esac

          SHOULD_BUILD=true
          if [[ "${EVENT_NAME}" == "schedule" && "${TAG}" == "${CURRENT}" ]]; then
            SHOULD_BUILD=false
          fi

          echo "current=${CURRENT}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

          echo "Event: ${EVENT_NAME}"
          echo "Current VERSION: ${CURRENT}"
          echo "Resolved stable tag: ${TAG}"
          echo "Targets: ${MATRIX}"
          echo "Build: ${SHOULD_BUILD}"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: true
          swap-storage: false

      - name: Build firmware
        env:
          OPENWRT_TAG: ${{ needs.resolve.outputs.tag }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload firmware and custom packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.target }}-${{ needs.resolve.outputs.tag }}
          path: openwrt/result/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish scheduled release
    needs:
      - resolve
      - build
    if: github.event_name == 'schedule' && needs.resolve.outputs.should_build == 'true' && success()
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*-${{ needs.resolve.outputs.tag }}
          path: release
          merge-multiple: false

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -Eeuo pipefail
          DATE="$(date -u +%Y%m%d)"
          echo "release_tag=${{ needs.resolve.outputs.tag }}-${DATE}-build.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "release_name=OpenWrt ${{ needs.resolve.outputs.tag }} build ${DATE}.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          make_latest: true
          files: |
            release/**/*
          body: |
            Automated scheduled OpenWrt build based on `${{ needs.resolve.outputs.tag }}`.

            Default networking features:
            - TCP Brutal v2 + `brutalctl`
            - BBR
            - MPLS routing / IP tunnel / GSO
            - nf_deaf
            - AmneziaWG 3.1 + LuCI protocol support

            Third-party sources are pinned in `third_party/versions.env` for reproducible builds.

      - name: Update VERSION after successful scheduled release
        env:
          NEW_VERSION: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' "${NEW_VERSION}" > VERSION
          git add VERSION
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update OpenWrt to ${NEW_VERSION}"
          git push
